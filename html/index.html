<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QBCore Telefon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="phone" class="hidden">
    <header>
      <span id="time">00:00</span>
      <span id="owner">Yukleniyor...</span>
      <button id="closeBtn">✕</button>
    </header>

    <main>
      <section id="home" class="view active"></section>

      <section id="contacts" class="view app-view">
        <h3>Kisiler</h3>
        <div class="row"><input id="contactName" placeholder="Isim" /><input id="contactNumber" placeholder="Numara" /><button id="addContact">Ekle</button></div>
        <ul id="contactList"></ul>
      </section>

      <section id="messages" class="view app-view">
        <h3>Mesajlar</h3>
        <div class="row"><input id="msgTo" placeholder="Numara" /><input id="msgText" placeholder="Mesaj" /><button id="sendMsg">Gonder</button></div>
        <ul id="messageList"></ul>
      </section>

      <section id="phoneapp" class="view app-view">
        <h3>Arama</h3>
        <input id="dialNumber" placeholder="Numara" />
        <button id="dialBtn">Ara</button>
        <div id="directoryResults"></div>
      </section>

      <section id="camera" class="view app-view">
        <h3>Kamera</h3>
        <input id="photoCaption" placeholder="Aciklama" />
        <button id="captureBtn">Fotograf Cek</button>
      </section>

      <section id="gallery" class="view app-view">
        <h3>Galeri</h3>
        <div id="galleryGrid"></div>
      </section>

      <section id="maps" class="view app-view">
        <h3>Harita</h3>
        <ul id="mapList"></ul>
      </section>

      <section id="browser" class="view app-view">
        <h3>Tarayici</h3>
        <div class="row"><input id="browserUrl" placeholder="URL" /><button id="openUrl">Ac</button></div>
        <iframe id="browserFrame" title="Tarayici"></iframe>
      </section>

      <section id="notes" class="view app-view">
        <h3>Notlar</h3>
        <textarea id="noteText" placeholder="Not yaz..."></textarea>
        <button id="saveNote">Not Kaydet</button>
        <ul id="noteList"></ul>
      </section>

      <section id="calculator" class="view app-view">
        <h3>Hesap Makinesi</h3>
        <input id="calcExpr" placeholder="(1+2)*3" />
        <button id="calcBtn">Hesapla</button>
        <div id="calcResult">0</div>
      </section>

      <section id="settings" class="view app-view">
        <h3>Ayarlar</h3>
        <label>Wallpaper CSS<input id="wallpaperInput" /></label>
        <button id="saveSettings">Kaydet</button>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
